name: Tag & Release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse ${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  cross-compile:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w" -o mathkit-${{ matrix.goos }}-${{ matrix.goarch }}${ext} ./cmd/mathkit
          tar czf mathkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz mathkit-${{ matrix.goos }}-${{ matrix.goarch }}${ext} README.md
      - uses: actions/upload-artifact@v4
        with:
          name: mathkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mathkit-*.tar.gz

  release:
    needs: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.tag.outputs.version }}"
          REPO="${{ github.repository }}"

          # Check if release already exists
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Release ${VERSION} already exists, deleting and recreating..."
            RELEASE_ID=$(curl -s \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${VERSION}" | jq -r '.id')
            curl -s -X DELETE \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}"
          fi

          # Create the release
          echo "Creating release ${VERSION}..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"${VERSION}\",\"generate_release_notes\":true}")

          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.upload_url' | sed 's/{?name,label}//')
          RELEASE_URL=$(echo "$RESPONSE" | jq -r '.html_url')

          if [ "$UPLOAD_URL" = "null" ] || [ -z "$UPLOAD_URL" ]; then
            echo "ERROR: Failed to create release"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "Release created: $RELEASE_URL"
          echo "Upload URL: $UPLOAD_URL"

          # Upload assets
          cd dist
          for file in *; do
            echo "Uploading $file..."
            UPLOAD_RESPONSE=$(curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/gzip" \
              --data-binary "@$file" \
              "${UPLOAD_URL}?name=$file")
            ASSET_URL=$(echo "$UPLOAD_RESPONSE" | jq -r '.browser_download_url')
            if [ "$ASSET_URL" = "null" ] || [ -z "$ASSET_URL" ]; then
              echo "WARNING: Failed to upload $file"
              echo "$UPLOAD_RESPONSE" | jq .
            else
              echo "  Uploaded: $ASSET_URL"
            fi
          done

          echo "Release ${VERSION} complete!"
